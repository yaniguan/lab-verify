name: demo
on:
  push:
    branches: [main]
  pull_request:
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt -e ".[dev]"
      - run: pytest -p no:cacheprovider -v
      - name: Verify 22/22 SQL gate benchmark and output parity
        run: |
          python demo/sql_gate.py > /tmp/sql_out.txt
          diff -u demo/output.txt /tmp/sql_out.txt
      - name: Verify extended benchmark suite (CTEs, ORDER BY, NULLs)
        run: python demo/sql_gate.py --candidates demo/candidates_extended.json
      - name: Verify mutant SQL synthesizer counterexample benchmark
        run: python community_extensions/mutant_sql_synthesizer.py
      - name: Validate benchmark license catalog and markdown links
        run: python scripts/check_catalog.py
      - name: Ensure repository working tree remains clean
        run: test -z "$(git status --porcelain)"

  lean:
    name: lean-4.36.0-kernel-and-axioms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -e ".[dev]"
      - name: Install Lean 4.36.0 via elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.36.0
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build LabVerifyLean executable and run kernel self-check
        run: |
          lean --version
          cd lean && lake build
          ./.lake/build/bin/lab-verify-lean --self-check
      - name: Run full test suite with live Lean 4.36.0 compilation and axiom checks
        env:
          REQUIRE_LIVE_LEAN: "1"
        run: pytest -p no:cacheprovider -v
      - name: Clean Lake build artifacts and verify clean working tree
        run: |
          rm -rf lean/.lake
          test -z "$(git status --porcelain)"
