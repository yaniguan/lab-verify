[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-verify"
version = "0.2.0"
description = "Default-deny mechanical verification gates for laboratory SQL queries, Lean 4 formalizations, and benchtop protocols."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "sqlglot>=25.0,<31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
]

[project.scripts]
lab-verify = "lab_verify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
